services:
  redis:
    image: redis:7-alpine
    container_name: staysync-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/admin-tools:1.22.4
    container_name: staysync-temporal
    entrypoint:
      - temporal
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.22.0
    container_name: staysync-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      temporal:
        condition: service_healthy

  api:
    build: .
    container_name: staysync-api
    restart: unless-stopped
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-aggregation
      SUPPLIER_A_URL: http://api:3000
      SUPPLIER_B_URL: http://api:3000
      SIMULATE_SUPPLIER_A_FAILURE: ${SIMULATE_SUPPLIER_A_FAILURE:-false}
      SIMULATE_SUPPLIER_B_FAILURE: ${SIMULATE_SUPPLIER_B_FAILURE:-false}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  worker:
    build: .
    container_name: staysync-worker
    command: node dist/temporal/worker.js
    restart: unless-stopped
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-aggregation
      SUPPLIER_A_URL: http://api:3000
      SUPPLIER_B_URL: http://api:3000
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy